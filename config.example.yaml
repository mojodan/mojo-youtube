# YouTube Downloader Configuration
# Copy this file to config.yaml and customize as needed

# Output directory for downloaded videos
output_dir: ./downloads

# Video quality settings
# Options: 'best', '1080p', '720p', '480p', or custom yt-dlp format string
quality: bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best

# Subtitle settings
subtitle_languages:
  - en  # English (primary)
  # - es  # Spanish (uncomment to add more)
  # - fr  # French

subtitle_format: srt  # Options: srt, vtt, json3

# Download behavior
max_retries: 3  # Number of retry attempts for failed downloads
skip_existing: true  # Skip downloading if file already exists

# File organization
organize_by_channel: false  # Create subdirectories by channel name
download_thumbnail: false  # Download video thumbnail image
save_metadata: true  # Save video metadata as JSON

# Logging and output
verbose: false  # Enable detailed logging
quiet: false  # Suppress all output except errors
log_file: youtube_downloader.log
